name: Deploy Solar PV Sizer

# Publishes solar-pv-sizer/ to GitHub Pages whenever it changes on main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'solar-pv-sizer/**'
      - '.github/workflows/deploy-solar-pv-sizer.yml'
  pull_request:
    paths:
      - 'solar-pv-sizer/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test solar-pv-sizer/tests/*.test.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: solar-pv-sizer
      - id: deployment
        uses: actions/deploy-pages@v4
